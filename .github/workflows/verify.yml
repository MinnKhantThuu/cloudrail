name: Verify alpha
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: cloudrail
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: cloudrail_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cloudrail -d cloudrail_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      CLOUDRAIL_INTEGRATION: '1'
      DATABASE_URL: postgres://cloudrail:ci-only-not-a-secret@127.0.0.1:5432/cloudrail_test?sslmode=disable
      CLOUDRAIL_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: go test -race ./...
      - run: go vet ./...
      - run: go test -race ./.github/scripts/host-envelope && go vet ./.github/scripts/host-envelope
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: npm ci --prefix apps/web && npm run build --prefix apps/web
      - run: npm audit --prefix apps/web --audit-level=high
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: python3 -m compileall -q scripts
      - run: python3 -m unittest discover -s scripts -p "test_maintenance.py" -v
      - run: python3 -m unittest discover -s scripts -p "test_host_recovery.py" -v
      - run: python3 -m json.tool deploy/aws/lightsail.json >/dev/null
      - run: python3 scripts/verify-release.py
      - run: bash scripts/build-release.sh
      - name: Attest release package provenance
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: .data/releases/*
      - uses: actions/upload-artifact@v4
        with:
          name: cloudrail-alpha-local-packages
          path: .data/releases/
          retention-days: 7
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: bash scripts/dev-up.sh
      - run: npm ci --prefix apps/web
      - run: npx playwright install --with-deps chrome
        working-directory: apps/web
      - run: npm run test:browser --prefix apps/web -- owner-setup.spec.ts
      - run: python3 scripts/phase2_acceptance.py
      - run: python3 scripts/acceptance.py
      - run: npm run test:browser --prefix apps/web -- workspace.spec.ts
      - if: always()
        run: bash scripts/compose.sh logs --tail=80 server agent

  maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the previously published alpha on a fresh runner
        run: |
          mkdir -p .data/maintenance-base
          git archive a3df208ce0b0d1a4f761aa0bea9b5231bda29a4d | tar -x -C .data/maintenance-base
          bash .data/maintenance-base/scripts/dev-up.sh
          python3 .data/maintenance-base/scripts/acceptance.py
          cp .data/maintenance-base/deploy/local/.env deploy/local/.env
          cp .data/maintenance-base/.data/test-owner.json .data/test-owner.json
          chmod 600 deploy/local/.env .data/test-owner.json
      - name: Upgrade, reject unsafe rollback, recover and continue deploying
        env:
          CLOUDRAIL_DISPOSABLE_TEST: '1'
        run: python3 scripts/maintenance-acceptance.py
      - if: always()
        run: bash scripts/compose.sh logs --tail=80 server agent

  host-backup:
    if: github.event_name == 'push' && github.repository == 'MinnKhantThuu/cloudrail'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      archive-id: ${{ steps.transfer.outputs.artifact-id }}
    env:
      CLOUDRAIL_DISPOSABLE_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - run: bash scripts/dev-up.sh
      - run: python3 scripts/phase2_acceptance.py
      - run: python3 scripts/phase5_acceptance.py
      - run: python3 scripts/volume-acceptance.py
      - name: Snapshot real application and platform state, then fence the source
        run: |
          python3 scripts/host-recovery-acceptance.py prepare
          python3 scripts/host-recovery.py backup .data/host-backup
          python3 scripts/host-recovery.py verify .data/host-backup
          bash scripts/host-recovery-ci.sh
      - name: Encrypt synthetic private fixtures for the independent runner
        env:
          CLOUDRAIL_RECOVERY_TEST_KEY: ${{ secrets.CLOUDRAIL_RECOVERY_TEST_KEY }}
        run: |
          tar -czf .data/host-transfer.tar.gz -C .data host-backup test-owner.json host-fixture.json
          go run ./.github/scripts/host-envelope seal .data/host-transfer.tar.gz .data/host-transfer.enc
      - uses: actions/upload-artifact@v4
        id: transfer
        with:
          name: host-recovery-transfer-${{ github.run_id }}
          path: .data/host-transfer.enc
          retention-days: 1
          compression-level: 0
      - if: failure()
        run: |
          docker logs --tail=40 cloudrail-server-1 || true
          docker logs --tail=40 cloudrail-agent-1 || true
  host-recovery:
    needs: host-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    env:
      CLOUDRAIL_DISPOSABLE_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: actions/download-artifact@v4
        with:
          name: host-recovery-transfer-${{ github.run_id }}
          path: .data
      - name: Authenticate the transfer and recover on the independent Ubuntu host
        env:
          CLOUDRAIL_RECOVERY_TEST_KEY: ${{ secrets.CLOUDRAIL_RECOVERY_TEST_KEY }}
        run: |
          go run ./.github/scripts/host-envelope open .data/host-transfer.enc .data/host-transfer.tar.gz
          tar -xzf .data/host-transfer.tar.gz -C .data
          python3 scripts/host-recovery.py restore "$PWD/.data/host-backup" --source-fenced
          python3 scripts/host-recovery-acceptance.py verify
      - if: failure()
        run: |
          docker ps -a --format '{{.Names}} {{.Status}}'
          docker logs --tail=40 cloudrail-server-1 || true
          docker logs --tail=40 cloudrail-agent-1 || true
      - name: Remove the encrypted transfer artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_ID: ${{ needs.host-backup.outputs.archive-id }}
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$TRANSFER_ID"
