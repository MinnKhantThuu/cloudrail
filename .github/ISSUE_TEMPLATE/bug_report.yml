name: Bug report
description: Report a reproducible Cloudrail problem.
body:
  - type: markdown
    attributes:
      value: "For security issues, use Security → Report a vulnerability. Do not attach credentials, .env files, private keys or backups."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS/architecture, Docker/Compose versions, local or public VPS.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted errors or screenshots
      description: Review application output for secrets before sharing.
