name: cloudrail

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: cloudrail
      POSTGRES_DB: cloudrail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/dev-up.sh first}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [management]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cloudrail -d cloudrail']
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  server:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
      target: server
    environment:
      DATABASE_URL: postgres://cloudrail:${POSTGRES_PASSWORD}@postgres:5432/cloudrail?sslmode=disable
      CLOUDRAIL_ADMIN_TOKEN: ${CLOUDRAIL_ADMIN_TOKEN:?Run scripts/dev-up.sh first}
      CLOUDRAIL_AGENT_TOKEN: ${CLOUDRAIL_AGENT_TOKEN:?Run scripts/dev-up.sh first}
      CLOUDRAIL_ENCRYPTION_KEY: ${CLOUDRAIL_ENCRYPTION_KEY:?Run scripts/dev-up.sh first}
      WEB_DIR: /web
      SERVER_STATE_DIR: /var/lib/cloudrail
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:8080/healthz']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [server-state:/var/lib/cloudrail, backups:/backups:ro]
    ports: ['127.0.0.1:8080:8080']
    networks: [management, dashboard]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 128m
    restart: unless-stopped

  agent:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
      target: agent
    environment:
      CLOUDRAIL_AGENT_TOKEN: ${CLOUDRAIL_AGENT_TOKEN:?Run scripts/dev-up.sh first}
      CONTROL_PLANE_URL: https://server:8443
      ENROLLMENT_URL: http://server:8080
      APP_NETWORK: cloudrail-apps
      READINESS_TIMEOUT: 15s
      BUILDKIT_HOST: unix:///buildkit/buildkitd.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - routes:/routes
      - backups:/backups
      - buildkit-socket:/buildkit
      - agent-state:/var/lib/cloudrail
    networks: [management, apps]
    depends_on:
      server: {condition: service_healthy}
      proxy: {condition: service_started}
    mem_limit: 128m
    restart: unless-stopped
    stop_grace_period: 10s

  registry:
    image: registry:3.1.1
    ports: ['127.0.0.1:5001:5000']
    volumes: [registry-data:/var/lib/registry]
    networks: [dashboard]
    mem_limit: 128m
    restart: unless-stopped

  buildkit:
    image: moby/buildkit:v0.33.0
    privileged: true
    network_mode: host
    command: [--addr, unix:///buildkit/buildkitd.sock, --config, /etc/buildkit/buildkitd.toml]
    volumes:
      - buildkit-socket:/buildkit
      - buildkit-cache:/var/lib/buildkit
      - ./buildkit.toml:/etc/buildkit/buildkitd.toml:ro
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped

  proxy:
    image: traefik:v3.5.2
    command:
      - --entrypoints.web.address=:8088
      - --providers.file.directory=/routes
      - --providers.file.watch=true
      - --providers.providersthrottleduration=100ms
      - --log.level=WARN
    volumes: [routes:/routes:ro]
    ports: ['127.0.0.1:8088:8088']
    networks: [apps]
    mem_limit: 128m
    restart: unless-stopped

networks:
  management: {internal: true}
  dashboard: {}
  apps: {name: cloudrail-apps}
volumes:
  database:
  routes:
  agent-state:
  server-state:
  registry-data:
  buildkit-socket:
  buildkit-cache:
  backups:
